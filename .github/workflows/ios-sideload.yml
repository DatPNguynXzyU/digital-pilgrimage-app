
name: iOS Sideload IPA

on:
  workflow_dispatch:
    inputs:
      enable_nfc:
        description: 'Enable NFC test (final signing profile must support NFC Tag Reading)'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iPhone release for Sideloadly
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client

    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://digital-pilgrimage-api.onrender.com/api' }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_IOS_API_KEY: ${{ vars.FIREBASE_IOS_API_KEY }}
      FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      ENABLE_IOS_NFC: ${{ inputs.enable_nfc && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Firebase iOS variables and prepare sideload configuration
        run: python3 ../scripts/prepare-ios-sideload.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Check iOS toolchain
        run: |
          xcodebuild -version
          flutter --version

      - run: flutter pub get --enforce-lockfile

      - run: flutter analyze --no-pub

      - run: flutter test --no-pub

      - name: Build release for physical iPhone without signing
        run: |
          flutter build ios --release --no-codesign --no-pub \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define-from-file=firebase-config.ios.json

      - name: Package and validate IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="build/ios/iphoneos/Runner.app"

          test -f "$APP/Runner"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist" | grep -Fx iPhoneOS

          xcrun lipo -info "$APP/Runner"
          xcrun lipo "$APP/Runner" -verify_arch arm64

          mkdir -p build/sideload/Payload
          ditto "$APP" build/sideload/Payload/Runner.app

          cd build/sideload
          ditto -c -k --keepParent Payload HanhTrinhAnNhien-sideload.ipa

          shasum -a 256 HanhTrinhAnNhien-sideload.ipa > SHA256SUMS.txt
          cp ../../ios/Runner/Runner.entitlements NFC.entitlements.plist

          printf '%s\n' "Commit: $GITHUB_SHA" "Run: $GITHUB_RUN_NUMBER" \
            'Unsigned iPhone release. Sign and install using Sideloadly.' \
            "NFC code enabled: $ENABLE_IOS_NFC" \
            'When NFC is enabled, final signing must preserve TAG entitlement and use an NFC-capable provisioning profile.' \
            'Unsigned IPA alone does not grant NFC access; free sideload signing may reject or remove the entitlement.' > BUILD-INFO.txt

      - name: Save IPA for Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: ios-sideload-${{ github.run_number }}
          path: |
            client/build/sideload/HanhTrinhAnNhien-sideload.ipa
            client/build/sideload/SHA256SUMS.txt
            client/build/sideload/BUILD-INFO.txt
            client/build/sideload/NFC.entitlements.plist
          if-no-files-found: error
          retention-days: 7
