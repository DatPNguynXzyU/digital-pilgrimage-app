services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { if (!rs.status().ok) quit(1); } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); quit(1); } if (!db.hello().isWritablePrimary) quit(1);'
      interval: 2s
      timeout: 10s
      retries: 40
  test:
    build: .
    command: ["npm", "test"]
    environment:
      TEST_MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
