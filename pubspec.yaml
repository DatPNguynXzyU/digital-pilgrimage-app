name: hanh_trinh_an_nhien
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.2
  http: ^1.6.0
  shared_preferences: ^2.5.6
  nfc_manager: ^4.2.1
  nfc_manager_ndef: ^1.1.0
  image_picker: ^1.2.4
  http_parser: ^4.1.2
  url_launcher: ^6.3.3
  local_auth: ^3.0.2
  # Firebase iOS 13 requires GTMSessionFetcher >=4; GoogleSignIn 9 requires <4.
  # Keep the Firebase iOS 12 family until GoogleSignIn supports Firebase 13.
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.1
  google_sign_in: ^7.2.0
  geolocator: ^14.1.2
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/app_icon.png"
  adaptive_icon_background: "#FFBD59"
  adaptive_icon_foreground: "images/app_icon_round.png" # Ảnh logo nền trong suốt

flutter:
  uses-material-design: true

  assets:
    - images/
    - images/buddha-meditation.png
    - images/folk/
    - assets/audio/mokugyo.wav
