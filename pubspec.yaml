name: hanh_trinh_an_nhien
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.2
  http: ^1.6.0
  shared_preferences: ^2.5.6
  nfc_manager: ^4.2.1
  nfc_manager_ndef: ^1.1.0
  image_picker: ^1.2.4
  http_parser: ^4.1.2
  url_launcher: ^6.3.3
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/app_icon.png"
  adaptive_icon_background: "#FFBD59"
  adaptive_icon_foreground: "images/app_icon_round.png" # Ảnh logo nền trong suốt

flutter:
  uses-material-design: true

  assets:
    - images/
